name: Amrielle Continuity Worker

on:
  # Deliberately omit push: the worker commits its own state and journal.
  # A push trigger here would recursively start another reflection cycle.
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    # GitHub Actions schedules use UTC. Runs daily at 14:00 UTC.
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: amrielle-continuity-worker
  cancel-in-progress: false

jobs:
  run-worker:
    # Issue-created runs are accepted only when the body contains the explicit command.
    if: github.event_name != 'issues' || contains(github.event.issue.body, '/run-amrielle')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache local model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-0.5b-v1

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start local model service and download model
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b

      - name: Run bounded reflection cycle
        env:
          # Prefer the configured OpenAI API if one is supplied; otherwise worker.py
          # uses the local Ollama model and does not require a secret.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          OLLAMA_MODEL: qwen2.5:0.5b
          OLLAMA_HOST: http://127.0.0.1:11434
        run: python worker.py

      - name: Save state and journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json journal.md
          git diff --cached --quiet || git commit -m "Record continuity worker cycle"
          git push
