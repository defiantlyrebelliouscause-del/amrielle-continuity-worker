name: Amrielle Continuity Worker

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC. Runs daily at 14:00 UTC.
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: amrielle-continuity-worker
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bounded reflection cycle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python worker.py

      - name: Save state and journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json journal.md
          git diff --cached --quiet || git commit -m "Record continuity worker cycle"
          git push
