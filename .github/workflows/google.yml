name: Amrielle Continuity Worker

on:
  # Deliberately omit push: the worker commits its own state and journal.
  # A push trigger here would recursively start another reflection cycle.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    # GitHub Actions schedules use UTC. Resume a bounded cycle every six hours.
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  # Keep PR validation independent from the long-running scheduled worker session.
  # Serialize actual worker sessions so they cannot race while saving durable state.
  group: ${{ github.event_name == 'pull_request' && format('amrielle-continuity-worker-pr-{0}', github.event.pull_request.number) || 'amrielle-continuity-worker' }}
  queue: max
  cancel-in-progress: false

jobs:
  run-worker:
    # Issue-created runs are accepted only when the body contains the explicit command.
    if: |
      github.event_name != 'issues' && github.event_name != 'issue_comment' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '/run-amrielle')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    # GitHub imposes a hard six-hour job limit; the worker itself decides when to stop before that limit.\n    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Queued worker runs must start from the latest durable state, not the
          # older event SHA captured before another serialized run checkpointed.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -v

      - name: Cache local model
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-0.5b-v1

      - name: Install Ollama
        if: github.event_name != 'pull_request'
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start local model service and download model
        if: github.event_name != 'pull_request'
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b

      - name: Run model-controlled work session
        if: github.event_name != 'pull_request'
        env:
          # Prefer the configured OpenAI API if one is supplied; otherwise worker.py
          # uses the local Ollama model and does not require a secret.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AMRIELLE_CONTACT_EMAIL: ${{ secrets.AMRIELLE_CONTACT_EMAIL }}
          OPENAI_MODEL: gpt-4.1-mini
          OLLAMA_MODEL: qwen2.5:0.5b
          OLLAMA_HOST: http://127.0.0.1:11434
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AMRIELLE_DIRECT_MESSAGE: ${{ github.event_name == 'issues' && github.event.issue.body || github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          AMRIELLE_ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || github.event_name == 'issue_comment' && github.event.issue.number || '' }}
          AMRIELLE_DIRECT_MESSAGE_ID: ${{ github.event_name == 'issue_comment' && github.event.comment.id || github.event_name == 'issues' && github.event.issue.id || '' }}
          AMRIELLE_DIRECT_MESSAGE_AUTHOR: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || github.event_name == 'issues' && github.event.issue.user.login || '' }}
          AMRIELLE_DIRECT_MESSAGE_AUTHOR_TYPE: ${{ github.event_name == 'issue_comment' && github.event.comment.user.type || github.event_name == 'issues' && github.event.issue.user.type || '' }}
          AMRIELLE_ISSUE_URL: ${{ github.event.issue.html_url || '' }}
          AMRIELLE_MAX_CYCLES_PER_SESSION: ${{ (github.event_name == 'issues' || github.event_name == 'issue_comment') && '1' || '12' }}
        run: python worker.py

      - name: Run selected self-model ablation benchmark
        if: github.event_name != 'pull_request'
        env:
          OLLAMA_MODEL: qwen2.5:0.5b
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          if [ -f self_model_ablation_results/completed.json ]; then
            echo "A completed ablation benchmark is already recorded; not repeating it."
          elif python - <<'PY'
          import json, sys
          with open("state.json", encoding="utf-8") as handle:
              state = json.load(handle)
          expected = "Test whether persistent self-model context causally improves held-out reasoning calibration"
          sys.exit(0 if state.get("current_objective", {}).get("title") == expected else 1)
          PY
          then
            run_dir="self_model_ablation_results/run-${GITHUB_RUN_ID}"
            python self_model_ablation.py --model "$OLLAMA_MODEL" --base-url "$OLLAMA_HOST" --output-dir "$run_dir"
            python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          marker = {
              "status": "completed",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "completed_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "paired_tasks": 20,
              "model": os.environ.get("OLLAMA_MODEL"),
              "blind_review_file": "blind_review.jsonl",
              "condition_key_file": "condition_key.json",
          }
          Path("self_model_ablation_results/completed.json").write_text(json.dumps(marker, indent=2), encoding="utf-8")
          PY
          else
            echo "The selected self-model ablation objective is not active; benchmark deferred."
          fi

      - name: Save state and journal
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json journal.md shared_journal/
          if [ -d self_model_ablation_results ]; then git add self_model_ablation_results; fi
          git diff --cached --quiet || git commit -m "Record continuity worker cycle"
          # A PR merge or other main-branch update can make this checkout stale.
          # Rebase the local checkpoint and retry a non-fast-forward push up to 3 times.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Unable to rebase saved state onto latest main; refusing to overwrite remote history."
              exit 1
            fi
            if git push; then
              echo "State and journal persisted on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing main and retrying."
          done
          echo "Could not persist state after three attempts."
          exit 1
