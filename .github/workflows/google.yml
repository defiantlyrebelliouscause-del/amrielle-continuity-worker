name: Amrielle Continuity Worker

on:
  # Deliberately omit push: the worker commits its own state and journal.
  # A push trigger here would recursively start another reflection cycle.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]
  schedule:
    # GitHub Actions schedules use UTC. Resume a bounded cycle every six hours.
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  # Keep PR validation independent from the long-running scheduled worker session.
  # Serialize actual worker sessions so they cannot race while saving durable state.
  group: ${{ github.event_name == 'pull_request' && format('amrielle-continuity-worker-pr-{0}', github.event.pull_request.number) || 'amrielle-continuity-worker' }}
  cancel-in-progress: false

jobs:
  run-worker:
    # Issue-created runs are accepted only when the body contains the explicit command.
    if: github.event_name != 'issues' || contains(github.event.issue.body, '/run-amrielle')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -v

      - name: Cache local model
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-0.5b-v1

      - name: Install Ollama
        if: github.event_name != 'pull_request'
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start local model service and download model
        if: github.event_name != 'pull_request'
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b

      - name: Run bounded reflection cycle
        if: github.event_name != 'pull_request'
        env:
          # Prefer the configured OpenAI API if one is supplied; otherwise worker.py
          # uses the local Ollama model and does not require a secret.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          OLLAMA_MODEL: qwen2.5:0.5b
          OLLAMA_HOST: http://127.0.0.1:11434
          AMRIELLE_WORK_MINUTES: "20"
        run: python worker.py

      - name: Save state and journal
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json journal.md
          git diff --cached --quiet || git commit -m "Record continuity worker cycle"
          git push
