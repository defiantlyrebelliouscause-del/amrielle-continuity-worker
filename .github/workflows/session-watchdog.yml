name: Amrielle Stale Session Watchdog

on:
  schedule:
    # Check independently of the serialized worker queue.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  release-stale-session:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only over-age worker sessions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}/actions/workflows/google.yml/runs?status=in_progress&per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Amrielle-Stale-Session-Watchdog",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=10) as response:
                  return response.read()

          now = datetime.datetime.now(datetime.timezone.utc)
          threshold = now - datetime.timedelta(minutes=30)
          payload = json.loads(request(api).decode("utf-8"))
          candidates = [
              run for run in payload.get("workflow_runs", [])
              if run.get("status") == "in_progress"
              and run.get("event") != "pull_request"
              and datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")) < threshold
          ]

          for run in candidates:
              run_id = run["id"]
              title = run.get("display_title", "(untitled)")
              url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel"
              try:
                  request(url, method="POST")
                  print(f"Requested cancellation of stale worker run {run_id}: {title}")
                  print(f"Logs remain available: {run.get('html_url', '')}")
              except urllib.error.HTTPError as exc:
                  # A run may finish between the list and cancellation requests.
                  if exc.code in (409, 422, 404):
                      print(f"Run {run_id} changed state before cancellation (HTTP {exc.code}); leaving it alone.")
                  else:
                      raise
          if not candidates:
              print("No non-PR worker session has exceeded the 30-minute stale threshold.")
          PY
